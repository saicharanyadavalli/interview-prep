# Top-level HTTP server block for Nginx reverse proxy
# Place in /etc/nginx/conf.d/interview-app.conf or /etc/nginx/sites-available/interview-app

# Optimization: upstream pool definitions
upstream frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream backend_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your EC2 Public IP or domain name
    # e.g.: server_name 13.200.xxx.xxx; or server_name interviewprep.example.com;
    server_name _;

    # Client body and header buffer tuning
    client_max_body_size 25M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ── Backend FastAPI API Routes ───────────────────────────────────────────
    location /api/backend/ {
        # Strip /api/backend prefix when forwarding to FastAPI root
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for longer LLM generations (Gemini assistant)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Direct health check bypass
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # ── Next.js Frontend ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Static assets cache header
        location /_next/static {
            proxy_pass http://frontend_upstream;
            proxy_cache_valid 200 365d;
            proxy_set_header Host $http_host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
