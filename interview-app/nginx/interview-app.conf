# Top-level HTTP/HTTPS server block for Nginx reverse proxy
# Production path: /etc/nginx/sites-available/interview-app

# Server obfuscation
server_tokens off;

# Rate limiting zones outside server block
# Configured for API backend routes (15 req/sec with burst of 30)
limit_req_zone $binary_remote_addr zone=api_rate_zone:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=addr_conn_zone:10m;

# Optimization: upstream pool definitions
upstream frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream backend_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP Server: Redirect to HTTPS ───────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ 16.113.92.222 localhost 127.0.0.1;

    # Health check bypass for external load balancers and internal probes
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server: Primary Application Server ────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _ 16.113.92.222 localhost 127.0.0.1;

    # SSL Certificate and Key
    ssl_certificate /etc/letsencrypt/live/16.113.92.222/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/16.113.92.222/privkey.pem;

    # Modern SSL Security Configuration (TLSv1.2 and TLSv1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy (CSP)
    # Explicitly accommodates:
    # - Google OAuth ('https://apis.google.com', 'https://accounts.google.com')
    # - Cognito User Pool ('https://cognito-idp.ap-south-2.amazonaws.com', 'https://*.auth.ap-south-2.amazoncognito.com')
    # - CloudFront CDN ('https://d1uj3o882835l0.cloudfront.net', 'https://*.cloudfront.net')
    # - Inline lesson scripts ('unsafe-inline'), WebAssembly ('wasm-unsafe-eval', 'unsafe-eval'), fonts ('data:'), SVG ('data:', 'blob:')
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://apis.google.com https://accounts.google.com https://d1uj3o882835l0.cloudfront.net https://*.cloudfront.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://d1uj3o882835l0.cloudfront.net; img-src 'self' data: blob: https://d1uj3o882835l0.cloudfront.net https://*.cloudfront.net https://res.cloudinary.com https://lh3.googleusercontent.com https://avatars.githubusercontent.com https://ui-avatars.com; font-src 'self' data: https://d1uj3o882835l0.cloudfront.net https://fonts.gstatic.com; connect-src 'self' https://cognito-idp.ap-south-2.amazonaws.com https://*.auth.ap-south-2.amazoncognito.com https://apis.google.com https://accounts.google.com https://d1uj3o882835l0.cloudfront.net https://*.cloudfront.net; worker-src 'self' blob:; child-src 'self' blob: https://accounts.google.com https://*.auth.ap-south-2.amazoncognito.com; frame-src 'self' https://accounts.google.com https://*.auth.ap-south-2.amazoncognito.com; frame-ancestors 'none'; form-action 'self' https://accounts.google.com https://*.auth.ap-south-2.amazoncognito.com; base-uri 'self'; object-src 'none'; media-src 'self' data: blob: https://d1uj3o882835l0.cloudfront.net https://*.cloudfront.net;" always;

    # Connection and Request Rate Limiting (per-IP limit on concurrent connections)
    limit_conn addr_conn_zone 20;

    # Client timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Client body and header buffer tuning
    client_max_body_size 25M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    # Upstream proxy buffer tuning for large OAuth session cookies (prevents 502 Bad Gateway)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ── Backend FastAPI API Routes (Rate limited with api_rate_zone) ──────────
    location /api/backend/ {
        limit_req zone=api_rate_zone burst=30 nodelay;
        limit_req_status 429;

        # Strip /api/backend prefix when forwarding to FastAPI root
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for longer LLM generations (Gemini assistant)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ── Direct health check bypass (Exempt from rate limits) ─────────────────
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # ── Authentication Callback Exemption (No rate limits) ───────────────────
    location /auth/callback {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # ── Authentication API Exemption (No rate limits) ────────────────────────
    location /api/auth/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # ── Static assets cache header (Exempt from rate limits) ──────────────────
    location /_next/static {
        proxy_pass http://frontend_upstream;
        proxy_cache_valid 200 365d;
        proxy_set_header Host $http_host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Next.js Frontend (Exempt from rate limits) ────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Upstream proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
