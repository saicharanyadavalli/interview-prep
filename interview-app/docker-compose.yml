# ============================================
# Interview Practice Platform - Full Stack Docker Compose
# Architecture: Next.js Frontend + FastAPI Backend + Redis/Valkey Cache
# ============================================

services:
  # ── Shared Cache & Distributed Rate Limiting ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: interview-prep-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-network

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: interview-prep-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      # Required credentials & keys
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_PRIMARY_MODEL=${GEMINI_PRIMARY_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-3.1-flash-lite}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Amazon Cognito User Pool authentication
      - COGNITO_REGION=${COGNITO_REGION:-ap-south-2}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      - COGNITO_DOMAIN=${COGNITO_DOMAIN:-}
      # Amazon RDS PostgreSQL & AWS Secrets Manager configuration
      - AWS_REGION=${AWS_REGION:-ap-south-2}
      - RDS_SECRET_NAME=${RDS_SECRET_NAME:-interview-prep/rds/app}
      - RDS_SECRET_ARN=${RDS_SECRET_ARN:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - RDS_POOL_MIN=${RDS_POOL_MIN:-2}
      - RDS_POOL_MAX=${RDS_POOL_MAX:-10}
      # AWS S3 & CloudFront Static Asset Delivery
      - S3_ASSETS_BUCKET=${S3_ASSETS_BUCKET:-interview-prep-assets-808431466075-personal-ap-south-2}
      - S3_ASSETS_REGION=${S3_ASSETS_REGION:-ap-south-2}
      - ASSET_BASE_URL=${ASSET_BASE_URL:-}
      # Centralized Cache & Distributed Rate Limiting (Amazon ElastiCache / Local Redis)
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_HOST=${CACHE_HOST:-}
      - CACHE_PORT=${CACHE_PORT:-6379}
      - CACHE_URL=${CACHE_URL-redis://redis:6379/0}
      - CACHE_TLS_ENABLED=${CACHE_TLS_ENABLED:-false}
      - CACHE_SECRET_NAME=${CACHE_SECRET_NAME:-}
      - CACHE_DB=${CACHE_DB:-0}
      - CACHE_KEY_PREFIX=${CACHE_KEY_PREFIX:-}
      - RATE_LIMIT_STORAGE_URI=${RATE_LIMIT_STORAGE_URI:-}
      - RATE_LIMIT_KEY_PREFIX=${RATE_LIMIT_KEY_PREFIX:-}
      # Bytecode caching on writable tmpfs to prevent write failures on read-only rootfs
      - PYTHONPYCACHEPREFIX=/tmp/pycache
    read_only: true
    tmpfs:
      - /tmp:size=128M,mode=1777,noexec,nodev,nosuid
      - /app/logs:size=32M,uid=1000,gid=1000,mode=0755,noexec,nodev,nosuid
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # ── LeetCode Sync Pipeline Worker ───────────────────────────────────────────
  leetcode-sync-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: interview-prep-leetcode-sync-worker
    restart: on-failure:5
    command: >
      sh -c '
        if [ -z "$$LEETCODE_SYNC_QUEUE_URL" ]; then
          echo "LEETCODE_SYNC_QUEUE_URL is not configured. Sync worker is disabled.";
          exit 0;
        fi;
        exec python -m workers.leetcode_sync_worker
      '
    environment:
      - PYTHONUNBUFFERED=1
      - AWS_REGION=${AWS_REGION:-ap-south-2}
      - RDS_SECRET_NAME=${RDS_SECRET_NAME:-interview-prep/rds/app}
      - RDS_SECRET_ARN=${RDS_SECRET_ARN:-}
      - LEETCODE_SYNC_QUEUE_URL=${LEETCODE_SYNC_QUEUE_URL:-}
      - LEETCODE_SOURCE_REPO=${LEETCODE_SOURCE_REPO:-doocs/leetcode}
      - LEETCODE_SOURCE_BRANCH=${LEETCODE_SOURCE_BRANCH:-main}
      - LEETCODE_QUESTIONS_PATH=${LEETCODE_QUESTIONS_PATH:-solution}
      - GITHUB_TOKEN_SECRET_ARN=${GITHUB_TOKEN_SECRET_ARN:-}
      - ENVIRONMENT=${ENVIRONMENT:-personal}
    networks:
      - app-network

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=/api/backend
        - COGNITO_REGION=${COGNITO_REGION:-ap-south-2}
        - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
        - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
        - COGNITO_DOMAIN=${COGNITO_DOMAIN:-}
        - PUBLIC_APP_ORIGIN=${PUBLIC_APP_ORIGIN:-https://app.interviewprep.com}
        - AUTH_REDIRECT_URL=${AUTH_REDIRECT_URL:-https://app.interviewprep.com/auth/callback?next=/dashboard}
        - NEXT_PUBLIC_AUTH_REDIRECT_URL=${NEXT_PUBLIC_AUTH_REDIRECT_URL:-${AUTH_REDIRECT_URL:-https://app.interviewprep.com/auth/callback?next=/dashboard}}
        - FRONTEND_URL=${FRONTEND_URL:-https://app.interviewprep.com}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-${FRONTEND_URL:-https://app.interviewprep.com}}
    container_name: interview-prep-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - COGNITO_REGION=${COGNITO_REGION:-ap-south-2}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      - COGNITO_DOMAIN=${COGNITO_DOMAIN:-}
      - PUBLIC_APP_ORIGIN=${PUBLIC_APP_ORIGIN:-https://app.interviewprep.com}
      - NEXT_PUBLIC_API_BASE_URL=/api/backend
      - BACKEND_INTERNAL_URL=http://backend:8000
      - AUTH_REDIRECT_URL=${AUTH_REDIRECT_URL:-https://app.interviewprep.com/auth/callback?next=/dashboard}
      - NEXT_PUBLIC_AUTH_REDIRECT_URL=${NEXT_PUBLIC_AUTH_REDIRECT_URL:-${AUTH_REDIRECT_URL:-https://app.interviewprep.com/auth/callback?next=/dashboard}}
      - FRONTEND_URL=${FRONTEND_URL:-https://app.interviewprep.com}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-${FRONTEND_URL:-https://app.interviewprep.com}}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    name: interview-prep-network
