AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS CloudFormation template provisioning an Amazon Cognito User Pool with optional Google OAuth 2.0 federation,
  Cognito Hosted UI domain prefix, and public web clients with PKCE for Interview Prep personal deployment.

Parameters:
  Environment:
    Type: String
    Default: personal
    AllowedValues:
      - personal
      - production
    Description: Environment stage for resource identification, domain prefixing, and tagging.

  CognitoDomainPrefix:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9](?:[a-z0-9\-]{0,61}[a-z0-9])?)?$'
    Description: >-
      Optional custom domain prefix for the Cognito Hosted UI.
      If empty, defaults to interview-prep-auth-${AWS::AccountId}-${Environment}.
      Must contain only lowercase letters, numbers, and hyphens (up to 63 characters).

  GoogleClientId:
    Type: String
    Default: ''
    Description: >-
      Google OAuth 2.0 Web Client ID obtained from Google Cloud Console credentials.
      If omitted, Cognito deploys with native email/password authentication only.

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Google OAuth 2.0 Web Client Secret obtained from Google Cloud Console credentials.
      If omitted, Cognito deploys with native email/password authentication only.

  CanonicalDomain:
    Type: String
    Default: '16.113.92.222'
    Description: >-
      Informational public application host. Set this to your real application hostname.
      OAuth callbacks still must be supplied as exact URLs in CallbackURLs and LogoutURLs.

  CallbackURLs:
    Type: CommaDelimitedList
    Default: 'http://localhost:3000/auth/callback'
    Description: >-
      Exact application callback URLs. Override with your real HTTPS application callback URL
      before enabling OAuth on the deployed app. Cognito permits HTTP only for localhost.

  LogoutURLs:
    Type: CommaDelimitedList
    Default: 'http://localhost:3000/login'
    Description: >-
      Exact application sign-out URLs. Override with your real HTTPS application URL before
      enabling OAuth on the deployed app. Cognito permits HTTP only for localhost.

  AdvancedSecurityMode:
    Type: String
    Default: 'OFF'
    AllowedValues:
      - 'OFF'
      - AUDIT
      - ENFORCED
    Description: >-
      Advanced security mode for Cognito threat protection and compromised credential auditing.
      Set to OFF by default to avoid enabling paid threat-protection features inadvertently.

  AccessTokenValidity:
    Type: Number
    Default: 60
    MinValue: 5
    MaxValue: 1440
    Description: 'Access token validity duration in minutes (default: 60 minutes).'

  IdTokenValidity:
    Type: Number
    Default: 60
    MinValue: 5
    MaxValue: 1440
    Description: 'ID token validity duration in minutes (default: 60 minutes).'

  RefreshTokenValidity:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3650
    Description: 'Refresh token validity duration in days (default: 30 days).'

Conditions:
  HasCustomDomainPrefix: !Not [!Equals [!Ref CognitoDomainPrefix, '']]
  HasGoogleFederation: !And
    - !Not [!Equals [!Ref GoogleClientId, '']]
    - !Not [!Equals [!Ref GoogleClientSecret, '']]
  NoGoogleFederation: !Or
    - !Equals [!Ref GoogleClientId, '']
    - !Equals [!Ref GoogleClientSecret, '']

Resources:
  # 1. Amazon Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub 'interview-prep-user-pool-${Environment}'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: 'Interview Prep - Verification Code'
        EmailMessage: 'Your verification code for Interview Prep is {####}.'
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Priority: 1
            Name: verified_email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      UserPoolAddOns:
        AdvancedSecurityMode: !Ref AdvancedSecurityMode
      UserPoolTags:
        Application: InterviewPrep
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  # 2. Amazon Cognito User Pool Domain (Hosted UI)
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !If
        - HasCustomDomainPrefix
        - !Ref CognitoDomainPrefix
        - !Sub 'interview-prep-auth-${AWS::AccountId}-${Environment}'
      UserPoolId: !Ref UserPool

  # 3. Google Identity Provider (created only when both Google credentials are supplied)
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleFederation
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: 'openid profile email'
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  # 4. Native Cognito client for email/password auth when Google is not configured
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: NoGoogleFederation
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: interview-prep-web-client
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs: !Ref CallbackURLs
      LogoutURLs: !Ref LogoutURLs
      AccessTokenValidity: !Ref AccessTokenValidity
      IdTokenValidity: !Ref IdTokenValidity
      RefreshTokenValidity: !Ref RefreshTokenValidity
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # 5. Federated Cognito client. Explicitly waits for Google provider creation.
  UserPoolClientWithGoogle:
    Type: AWS::Cognito::UserPoolClient
    Condition: HasGoogleFederation
    DependsOn:
      - GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: interview-prep-web-client
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
        - Google
      CallbackURLs: !Ref CallbackURLs
      LogoutURLs: !Ref LogoutURLs
      AccessTokenValidity: !Ref AccessTokenValidity
      IdTokenValidity: !Ref IdTokenValidity
      RefreshTokenValidity: !Ref RefreshTokenValidity
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

Outputs:
  UserPoolId:
    Description: Identifier of the Cognito User Pool
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  UserPoolArn:
    Description: Amazon Resource Name (ARN) of the Cognito User Pool
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolArn'

  UserPoolClientId:
    Description: ID of the public web app client selected for the configured auth providers
    Value: !If [HasGoogleFederation, !Ref UserPoolClientWithGoogle, !Ref UserPoolClient]
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'

  CognitoDomain:
    Description: Domain prefix configured for the Cognito Hosted UI
    Value: !Ref UserPoolDomain
    Export:
      Name: !Sub '${AWS::StackName}-CognitoDomain'

  UserPoolProviderURL:
    Description: OpenID Connect provider discovery base URL for the User Pool
    Value: !GetAtt UserPool.ProviderURL
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolProviderURL'

  HostedUIDomain:
    Description: Full HTTPS base URL for the Cognito Hosted UI
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${AWS::StackName}-HostedUIDomain'

  GoogleOAuthRedirectUri:
    Description: Authorized redirect URI to register in Google Cloud Console OAuth 2.0 Client credentials
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse'
    Export:
      Name: !Sub '${AWS::StackName}-GoogleOAuthRedirectUri'

  OAuthAuthorizeUrl:
    Description: OAuth 2.0 authorize endpoint URL for launching login and federation flows
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize'
    Export:
      Name: !Sub '${AWS::StackName}-OAuthAuthorizeUrl'

  OAuthTokenUrl:
    Description: OAuth 2.0 token endpoint URL for Authorization Code Grant token exchange
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'
    Export:
      Name: !Sub '${AWS::StackName}-OAuthTokenUrl'
